services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: studyhub
      MYSQL_USER: studyhub
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u studyhub -p\"$$MYSQL_PASSWORD\" studyhub -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/studyhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: studyhub
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
  mobile:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP_DIR: mobile-web
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${MOBILE_PORT:-5173}:80"
  admin:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        APP_DIR: admin-web
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5174}:80"

volumes:
  mysql:
  uploads:
